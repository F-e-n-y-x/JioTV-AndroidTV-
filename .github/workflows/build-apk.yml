name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default is 'tools platform-tools'; the legacy 'tools' package no longer exists and fails sdkmanager.
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Release Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > jtv-release.keystore
            cat <<EOF > keystore.properties
          storeFile=jtv-release.keystore
          storePassword=${RELEASE_KEYSTORE_PASSWORD}
          keyAlias=${RELEASE_KEY_ALIAS}
          keyPassword=${RELEASE_KEY_PASSWORD}
          EOF
            echo "Release keystore configured successfully."
          else
            echo "RELEASE_KEYSTORE_BASE64 not set, will fall back to debug signing."
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate and Rename APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          VERSION_TAG="${{ github.ref_name }}"
          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            VERSION_TAG="dev-${GITHUB_SHA::7}"
          fi
          RELEASE_APK="JTV-${VERSION_TAG}.apk"
          cp "$APK_PATH" "../$RELEASE_APK"
          echo "apk_path=$RELEASE_APK" >> $GITHUB_OUTPUT
          echo "release_name=JTV ${VERSION_TAG}" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jtv-release-apk
          path: ${{ steps.apk.outputs.apk_path }}

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.apk.outputs.release_name }}
          files: ${{ steps.apk.outputs.apk_path }}
          draft: false
          # Tags with a suffix (v2.0-beta, v2.0-beta.2) are pre-releases: GitHub keeps them out of
          # /releases/latest, so stable installs never auto-update to them.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          # Betas use the hand-written notes (current beta + every earlier beta); stable keeps GitHub's.
          body_path: ${{ contains(github.ref_name, '-') && '.github/BETA_NOTES.md' || '' }}
          generate_release_notes: ${{ !contains(github.ref_name, '-') }}

      # One beta at a time: delete the older pre-releases (their git tags stay). Stable is never touched.
      - name: Remove older beta releases
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" -L 100 --json tagName,isPrerelease \
            -q '.[] | select(.isPrerelease) | .tagName' |
          while read -r tag; do
            if [ "$tag" != "${{ github.ref_name }}" ]; then gh release delete "$tag" -R "$GITHUB_REPOSITORY" --yes; fi
          done
