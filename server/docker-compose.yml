services:
  jtv-server:
    build: .
    image: jiotv-server
    container_name: jtv-server
    restart: unless-stopped
    env_file: [.env]
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
    ports:
      - "8080:8080"
    volumes:
      - jtv-data:/app/data

  # Optional automatic HTTPS (required for browser Widevine playback in Phase 2).
  # Enable with:  docker compose --profile https up -d   (after editing Caddyfile with your domain)
  caddy:
    image: caddy:2-alpine
    container_name: jtv-caddy
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [jtv-server]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  jtv-data:
  caddy-data:
  caddy-config:
