x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  jtv-server:
    build: .
    image: jiotv-server
    container_name: jtv-server
    restart: unless-stopped
    # Tiny init as PID 1: forwards SIGTERM to node (graceful shutdown) and reaps zombies.
    init: true
    stop_grace_period: 15s
    env_file: [.env]
    environment:
      # One port for the web page, the app and LAN discovery (29180 is unassigned and unused by
      # common home-server apps). Existing setups can keep PORT=8080 in .env.
      - PORT=${PORT:-29180}
      - DATA_DIR=/app/data
      # Honour X-Forwarded-* from Cloudflare / Caddy (https links, real client IP for rate limits).
      # Set to false if the port is exposed straight to the internet with no proxy in front.
      - TRUST_PROXY=${TRUST_PROXY:-true}
      # Shown in the app's "Servers on your network" list.
      - SERVER_NAME=${SERVER_NAME:-JTV server}
    ports:
      - "${PORT:-29180}:${PORT:-29180}"
      # Only when PORT isn't 29180: the app still finds the server through 29180.
      # - "29180:29180"
    volumes:
      - jtv-data:/app/data
    logging: *default-logging

  # Optional automatic HTTPS (required for browser Widevine playback in Phase 2).
  # Enable with:  docker compose --profile https up -d   (after editing Caddyfile with your domain)
  caddy:
    image: caddy:2-alpine
    container_name: jtv-caddy
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [jtv-server]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *default-logging

volumes:
  jtv-data:
  caddy-data:
  caddy-config:
